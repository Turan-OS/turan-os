# nginx-конфиг сайта. Копируется в /etc/nginx/sites-available/turan-os
# SSL-строки добавит certbot автоматически (см. DEPLOY.md).

server {
    listen 80;
    server_name turan-os.local www.turan-os.local;

    # лимит на загрузку файлов (аудио домашек до 25 МБ)
    client_max_body_size 30M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
